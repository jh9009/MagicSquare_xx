[project]
name = "magic-square-xx"
version = "0.1.0"
description = "4x4 partial magic square — ECB + Dual-Track TDD harness"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity", "src/control", "src/boundary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "entity: Entity track (Dual-Track TDD)",
    "control: Control track (Dual-Track TDD)",
    "boundary: Boundary track (Dual-Track TDD)",
]
